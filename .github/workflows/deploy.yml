name: Build and deploy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: personal-site-production
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify site
        run: npm run build

      - name: Configure production SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          deploy_key_secret: ${{ secrets.DEPLOY_KEY }}
          deploy_known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$deploy_known_hosts" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          umask 077
          printf '%s\n' "$deploy_key_secret" > "$RUNNER_TEMP/personal_site_deploy_key"

      - name: Deploy production release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          deploy_host: 106.14.173.234
          deploy_user: admin
          deploy_root: /var/www/personal_site/runtime
          deploy_key_path: ${{ runner.temp }}/personal_site_deploy_key
          release_name: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          site_url: http://106.14.173.234
        run: bash scripts/deploy.sh

      - name: Remove deployment secrets
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rm -f -- "$RUNNER_TEMP/personal_site_deploy_key"
          rm -f -- "$HOME/.ssh/known_hosts"
